<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人页面</title>
    <style>
        body{
            font-family:"Microsoft YaHei", sans-serif;
            font-size:17px;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .side-img{
            max-width:180px;
            border-radius:8px;
        }
        .info-box{
            background-color:#f0f4f9;
            padding:20px;
            margin:15px;
            color:#222;
        }
        .info-row{
            display: flex;
            align-items: flex-start;
            gap:24px;
        }
        .hobby-box{
            background-color:#eef4fc;
            padding:20px;
            margin:15px;
        }
        .paper-box{
            background-color:#f4f7fb;
            padding:20px;
            margin:15px;
        }
        .secret-box{
            background-color:#fff2cc;
            padding:20px;
            margin:15px;
        }
        h2{
            font-size:28px;
            font-weight:bold;
            color:#112244;
            margin-top:0;
        }
        h3{
            font-size:22px;
            color:#1a3359;
        }
        a{
            color:#0052cc;
        }
    </style>
</head>
<body>
    <div class="info-box" draggable="false">
        <div class="info-row">
            <div class="left">
                <img class="avatar" src="https://n.sinaimg.cn/sinacn10104/121/w1200h2121/20190805/b2d1-iatixpm2362975.jpg" alt="个人头像">
            </div>
            <div class="right">
                <h2>谭承</h2>
                <p>曲师大第一阿珂</p>
                <img class="side-img" src="C:\Users\1\Downloads\屏幕截图_4-9-2026_195241_thf.bing.com.jpeg" alt="配图">
            </div>
        </div>
    </div>

    <div class="hobby-box" draggable="false">
        <h3>我的爱好</h3>
        <h4>热衷(掌握程度)</h4>
        <p>算法 & 数据结构：<progress value="75" max="100"></progress> 75%</p>
        <p>独立游戏开发：<progress value="60" max="100"></progress> 60%</p>
        <p>自然语言处理：<progress value="50" max="100"></progress> 50%</p>
        <p>摄影与构图：<progress value="80" max="100"></progress> 80%</p>
    </div>

    <div class="paper-box" draggable="false">
        <h3>论文·下载 PDF</h3>
        <p>基于深度学习的时序预测优化
            <a href="https://www.yjbys.com/biyelunwen/kaitibaogao/666218.html" download>下载PDF</a>
        </p>
    </div>

   
    <div style="margin:15px;">
        <h3>私密区域解锁</h3>
        <input type="password" id="pwdInput" placeholder="请输入密码">
        <button onclick="unlock()">确认解锁</button>
    </div>

    <div id="secretContent" class="secret-box" hidden draggable="false">
        <h3>🔒私密内容</h3>
        <p>这部分页面初始是隐藏，输入正确密码才显示出来</p>
    </div>

<script>
function unlock(){
    let pwd = document.getElementById("pwdInput").value;
    let secret = document.getElementById("secretContent");
    if(pwd === "123456"){
        secret.hidden = false;
    }else{
        alert("密码错误！");
    }
}
</script>
</body>
</html>
